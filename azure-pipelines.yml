# Azure Pipelines: test -> build image -> push to ACR -> deploy to App Service -> smoke test
trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

variables:
  # ---- EDIT THESE (or define as pipeline variables) ----
  acrServiceConnection: 'acr-service-connection'   # Docker Registry service connection (Azure Container Registry)
  azureServiceConnection: 'azure-rm-connection'    # Azure Resource Manager service connection
  acrName: 'codealphaacr'                          # ACR name, without .azurecr.io
  webAppName: 'codealpha-cicd-app'                 # App Service name
  # -------------------------------------------------------
  imageRepository: 'codealpha-cicd-app'
  tag: '$(Build.BuildId)'
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Test, build and push image
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: $(vmImage)
        steps:
          - task: NodeTool@0
            displayName: Install Node 20
            inputs:
              versionSpec: '20.x'

          - script: mkdir -p test-results && npm test -- --test-reporter=junit --test-reporter-destination=$(System.DefaultWorkingDirectory)/test-results/junit.xml
            displayName: Run unit tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'test-results/junit.xml'

          - task: Docker@2
            displayName: Build and push image to ACR
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              command: buildAndPush
              containerRegistry: $(acrServiceConnection)
              repository: $(imageRepository)
              dockerfile: Dockerfile
              buildContext: .
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployWeb
        displayName: Deploy container
        environment: 'production'      # add approvals/checks on this Environment in Azure DevOps
        pool:
          vmImage: $(vmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: Deploy image to App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: $(webAppName)
                    containers: $(acrName).azurecr.io/$(imageRepository):$(tag)
                    appSettings: '-APP_VERSION 1.0.$(Build.BuildId) -BUILD_ID $(Build.BuildNumber)'

                - script: |
                    url="https://$(webAppName).azurewebsites.net/health"
                    for i in $(seq 1 12); do
                      code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
                      echo "attempt $i: HTTP $code"
                      [ "$code" = "200" ] && exit 0
                      sleep 10
                    done
                    echo "Smoke test failed"; exit 1
                  displayName: Smoke test /health
